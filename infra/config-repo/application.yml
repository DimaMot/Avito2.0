spring:
  main:
    banner-mode: off
    log-startup-info: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
      jdbc:
        time_zone: UTC
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    deserialization:
      adjust-dates-to-context-time-zone: false

logging:
  level:
    org:
      springframework:
        transaction: INFO
        interceptor: TRACE
        orm:
          jpa: INFO
          jpa.JpaTransactionManager: DEBUG

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/

app:
  timezone: "Europe/Moscow"