spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/avitodb
    username: user
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
      jdbc:
        time_zone: UTC
  sql:
    init:
      mode: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: true
    deserialization:
      adjust-dates-to-context-time-zone: false

logging:
  level:
    org:
      springframework:
        transaction: INFO
        interceptor: TRACE
        orm:
          jpa: INFO
          jpa.JpaTransactionManager: DEBUG

