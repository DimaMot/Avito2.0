services:
  config-server:
    build:
      context: ./infra/config-server
      dockerfile: Dockerfile
    container_name: config-server
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config-repo/
    volumes:
      - ./infra/config-repo:/app/config-repo
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  discovery-server:
    build:
      context: ./infra/discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-server:
    build:
      context: ./infra/gateway
      dockerfile: Dockerfile
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  user-server:
    build:
      context: ./avito-services/avito-users
      dockerfile: Dockerfile
    container_name: user-server
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userDB:5432/usersDB
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    depends_on:
      userDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  item-server:
    build:
      context: ./avito-services/avito-items
      dockerfile: Dockerfile
    container_name: item-server
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://itemDB:5432/itemsDB
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    depends_on:
      itemDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  booking-server:
    build:
      context: ./avito-services/avito-bookings
      dockerfile: Dockerfile
    container_name: booking-server
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookingDB:5432/bookingsDB
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    depends_on:
      bookingDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  analytic-server:
    build:
      context: ./avito-analytics
      dockerfile: Dockerfile
    container_name: analytic-server
    ports:
      - "8084:8084"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://analyticDB:5432/analyticsDB
    depends_on:
      kafka:
        condition: service_healthy
      analyticDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  userDB:
    image: postgres:16.1
    container_name: avito-userDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usersDB
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgresql_USERSdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d usersDB -U user"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  itemDB:
    image: postgres:16.1
    container_name: avito-itemDB
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=itemsDB
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgresql_ITEMSdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d itemsDB -U user"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bookingDB:
    image: postgres:16.1
    container_name: avito-bookingDB
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=bookingsDB
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgresql_BOOKINGSdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d bookingsDB -U user"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  analyticDB:
    image: postgres:16.1
    container_name: avito-analyticDB
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=analyticsDB
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgresql_ANALYTICdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -d analyticsDB -U user" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgresql_ITEMSdata:
  postgresql_USERSdata:
  postgresql_BOOKINGSdata:
  kafka_data:
  postgresql_ANALYTICdata: