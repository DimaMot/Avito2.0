spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false